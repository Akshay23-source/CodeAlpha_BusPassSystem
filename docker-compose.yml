

services:
  db:
    image: postgres:15-alpine
    container_name: smarttransit_db
    environment:
      POSTGRES_DB: buspass_db
      POSTGRES_USER: transit_user
      POSTGRES_PASSWORD: transit_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit_user -d buspass_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smarttransit_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: smarttransit_backend
    environment:
      DATABASE_URL: postgresql://transit_user:transit_password_2026@db:5432/buspass_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: super_secure_transit_key_2026
      FLASK_ENV: production
      MONGO_URI: ${MONGO_URI}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: smarttransit_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata: